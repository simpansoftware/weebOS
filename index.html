<!DOCTYPE html>
<html>
    <head>

            <img src="mango.jpg" alt="mango" style="margin-left: 16px; margin-right: auto;">

            <div id="welcomeheader" style="display: flex; justify-content: space-between; align-items: center; cursor: move;">
                <span>Welcome</span>
                <span id="welcomeclose" style="cursor: pointer; width: 16px; height: 16px; background-color: red; margin-right: 8px; border-radius: 8px;"></span>
